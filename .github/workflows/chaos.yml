name: Chaos Engineering

# AUDIT N3: the old workflow never parsed (a `python -c` block at column 0
# broke the YAML, a bash `if` had no `fi`) and probed localhost:8000 on a
# runner where nothing was running. The experiments drive Docker directly, so
# they run against a compose stack started inside this job. All external
# providers point at a closed port: the run spends nothing and sends nothing.

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment ID (01-06 or 'all')"
        required: true
        default: "all"
        type: choice
        options: [all, "01", "02", "03", "04", "05", "06"]

permissions:
  contents: read

concurrency:
  group: chaos
  cancel-in-progress: false

env:
  TECHFLOW_ENV: ci
  COMPOSE_PROJECT_NAME: techflow-chaos
  TECHFLOW_COMPOSE_PROJECT: techflow-chaos
  TECHFLOW_API_URL: http://localhost:8000
  # Throwaway key for the job's own stack, never a real secret.
  API_KEY: chaos-ci-key
  # Compose checks the nested ${API_KEY_SECRET:?} even when API_KEY is set
  # (runner Compose version), so both must be present.
  API_KEY_SECRET: chaos-ci-key
  TECHFLOW_API_KEY: chaos-ci-key
  OPENROUTER_API_KEY: mock-not-a-key
  OPENROUTER_BASE_URL: http://127.0.0.1:9/v1
  GEMINI_API_KEY: ""
  GEMINI_BASE_URL: http://127.0.0.1:9/v1
  DEEPSEEK_API_KEY: ""
  GROQ_API_KEY: ""
  OPENAI_API_KEY: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  GMAIL_CLIENT_ID: ""
  GMAIL_CLIENT_SECRET: ""
  ENABLE_GMAIL_POLLING: "false"
  CHAOS_DISRUPTION_DURATION: "10"
  CHAOS_RECOVERY_TIMEOUT: "120"

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the chaos runner's dependency
        run: pip install httpx

      - name: Start the stack
        run: |
          docker compose up -d --build --wait --wait-timeout 600 \
            postgres zookeeper kafka migrate kb-embed api worker prometheus
          curl -fsS "$TECHFLOW_API_URL/readyz"

      - name: Run chaos experiments
        run: |
          python -u -m chaos.runner \
            --experiment "${{ inputs.experiment || 'all' }}" \
            --yes \
            --output chaos-results.json

      - name: Summary
        if: always()
        run: |
          if [ ! -f chaos-results.json ]; then
            echo "No results file: the runner did not finish" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "| Experiment | Status | Recovery (s) | Errors |"
            echo "|---|---|---|---|"
            jq -r '.results[] | "| \(.experiment_name) | \(.status) | \(.recovery_time_seconds // "-") | \(.errors_observed | join("; ")) |"' chaos-results.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container state and logs
        if: failure()
        run: |
          docker ps -a
          ids=$(docker ps -aq)
          if [ -n "$ids" ]; then
            docker inspect -f '{{.Name}} restarts={{.RestartCount}} exit={{.State.ExitCode}}' $ids
          fi
          docker compose logs --no-color --tail=200 api worker

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-results-${{ github.run_id }}
          path: chaos-results.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
