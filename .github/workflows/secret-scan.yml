name: secret-scan

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  scan-history:
    name: Scan history & working tree for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan with gitleaks
        run: |
          TAG=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oE '"tag_name": *"v[^"]*"' | sed 's/.*"v\(.*\)"/\1/')
          case "$(uname -m)" in
            x86_64) ARCH=x64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) ARCH=$(uname -m) ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${TAG}/gitleaks_${TAG}_linux_${ARCH}.tar.gz" | tar -xz
          ./gitleaks detect --redact --source="$PWD" --exit-code 1

      - name: Block dangerous filenames
        run: |
          BLOCKED_FILES=$(git ls-files | grep -E '(^|/)\.env([^.]|$)|(^|/)\.env\.[a-zA-Z]|\.env\.local$|\.env\.[a-zA-Z]+\.bak$|gmail_credential.*\.json|gmail_token.*\.json|.*_token\.json$|.*\.pem$|.*\.key$|.*\.tfvars$|k8s/.+secret.*\.ya?ml' || true)
          if [[ -n "$BLOCKED_FILES" ]]; then
            echo "blocked files in repo:"; echo "$BLOCKED_FILES"
            exit 1
          fi
          echo "no sensitive files tracked ✓"