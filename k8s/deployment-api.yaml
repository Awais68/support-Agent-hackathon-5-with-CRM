apiVersion: apps/v1
kind: Deployment
metadata:
  name: techflow-api
  namespace: techflow
  labels:
    app: api
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
      labels:
        app: api
        version: v1
    spec:
      containers:
      - name: api
        image: techflow-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        # Prometheus scrapes this pod port directly; the Service and ingress
        # only carry 8000, so metrics are not public (S11).
        - containerPort: 9100
          name: metrics
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: techflow-secrets
              key: database-url
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: techflow-config
              key: kafka-servers
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: techflow-secrets
              key: openrouter-api-key
        - name: OPENROUTER_BASE_URL
          value: "https://openrouter.ai/api/v1"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: techflow-secrets
              key: api-key
        - name: RUN_MODE
          value: "api"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # /livez never checks dependencies (a DB outage must not restart every
        # pod); /readyz returns 503 while the DB or Kafka is down (AUDIT N6).
        livenessProbe:
          httpGet:
            path: /livez
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
