apiVersion: apps/v1
kind: Deployment
metadata:
  name: techflow-worker
  namespace: techflow
  labels:
    app: worker
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: worker
        version: v1
    spec:
      containers:
      - name: worker
        image: techflow-api:latest
        imagePullPolicy: Always
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: techflow-secrets
              key: database-url
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: techflow-config
              key: kafka-servers
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: techflow-secrets
              key: openrouter-api-key
        - name: OPENROUTER_BASE_URL
          value: "https://openrouter.ai/api/v1"
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: techflow-secrets
              key: twilio-account-sid
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: techflow-secrets
              key: twilio-auth-token
        - name: TWILIO_WHATSAPP_NUMBER
          valueFrom:
            secretKeyRef:
              name: techflow-secrets
              key: twilio-whatsapp-number
        - name: RUN_MODE
          value: "worker"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
---
# NOTE: HPA removed. Replaced by KEDA ScaledObject at k8s/scaledobject-worker.yaml
# KEDA manages scaling with Kafka lag + CPU metrics combined.
#
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: techflow-worker-pdb
  namespace: techflow
  labels:
    app: worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: worker
