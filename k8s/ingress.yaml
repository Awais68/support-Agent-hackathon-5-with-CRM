apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: techflow-ingress
  namespace: techflow
  annotations:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # TODO: Uncomment and replace with your actual cert-manager cluster issuer
    kubernetes.io/ingress.class: nginx
spec:
  tls:
  - hosts:
    - techflow.example.com  # TODO: Replace with your actual domain
    secretName: techflow-tls  # cert-manager will create this Secret
  rules:
  - host: techflow.example.com  # TODO: Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: techflow-web-form
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: techflow-api
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: techflow-api
            port:
              number: 80
