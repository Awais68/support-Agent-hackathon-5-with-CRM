---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-kafka-auth
  namespace: techflow
spec:
  secretTargetRef:
  - parameter: sasl
    name: techflow-secrets
    key: kafka-sasl-type
  - parameter: saslUsername
    name: techflow-secrets
    key: kafka-sasl-username
  - parameter: saslPassword
    name: techflow-secrets
    key: kafka-sasl-password
  # For SASL_SSL with SCRAM-SHA-512 or PLAIN:
  # - parameter: tls
  #   name: techflow-secrets
  #   key: kafka-tls-enabled
  # - parameter: ca
  #   name: techflow-secrets
  #   key: kafka-ca-cert
  # - parameter: cert
  #   name: techflow-secrets
  #   key: kafka-client-cert
  # - parameter: key
  #   name: techflow-secrets
  #   key: kafka-client-key
  # - parameter: passphrase
  #   name: techflow-secrets
  #   key: kafka-client-key-passphrase
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: techflow-worker-scaledobject
  namespace: techflow
  labels:
    app: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: techflow-worker
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 4
            periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
          - type: Percent
            value: 50
            periodSeconds: 60
          selectPolicy: Max
  triggers:
  # One trigger per inbound topic the worker subscribes to; the HPA KEDA
  # creates scales on the max across triggers.
  - type: kafka
    metadata:
      # Read from the worker container's env (techflow-config/kafka-servers)
      # so KEDA watches the same brokers the worker consumes from.
      bootstrapServersFromEnv: KAFKA_BOOTSTRAP_SERVERS
      # Must match workers/message_processor.py (group_id + subscribed topics)
      # and kafka_client.py topic constants.
      consumerGroup: techflow-message-processor
      topic: inbound.email
      lagThreshold: "100"
      # Matches the consumer's auto_offset_reset="earliest" (kafka_client.py).
      offsetResetPolicy: earliest
    authenticationRef:
      name: keda-kafka-auth
  - type: kafka
    metadata:
      bootstrapServersFromEnv: KAFKA_BOOTSTRAP_SERVERS
      consumerGroup: techflow-message-processor
      topic: inbound.whatsapp
      lagThreshold: "100"
      offsetResetPolicy: earliest
    authenticationRef:
      name: keda-kafka-auth
  - type: kafka
    metadata:
      bootstrapServersFromEnv: KAFKA_BOOTSTRAP_SERVERS
      consumerGroup: techflow-message-processor
      topic: inbound.webform
      lagThreshold: "100"
      offsetResetPolicy: earliest
    authenticationRef:
      name: keda-kafka-auth
  - type: cpu
    metricType: Utilization
    metadata:
      value: "70"
  # Uncomment below to also scale on memory:
  # - type: memory
  #   metricType: Utilization
  #   metadata:
  #     value: "80"
---
# NOTES:
# 1. This ScaledObject REPLACES the old CPU-only HPA.
#    The old HPA (in deployment-worker.yaml) should be removed/deleted.
#
# 2. KEDA creates an HPA under the hood with BOTH metrics:
#    - CPU Utilization at 70%
#    - Kafka consumer lag (external metric) at 100
#    The HPA picks the MAX of all metrics for scale decisions.
#
# 3. minReplicaCount: 2 — prevents zero-scale for critical workers
#    maxReplicaCount: 10 — upper limit
#    No idleReplicaCount: with it set to 0, KEDA would scale the workers to
#    zero whenever there is no lag, defeating minReplicaCount.
#
# 4. For PLAINTEXT Kafka (no auth), remove `authenticationRef` entirely.
#
# 5. consumerGroup/topics match workers/message_processor.py; brokers come
#    from the worker's KAFKA_BOOTSTRAP_SERVERS (k8s/configmap.yaml).
#
# 6. To test: produce messages to the topic and watch replica count increase:
#    kubectl get hpa -n techflow -w
#    kubectl get scaledobject -n techflow
