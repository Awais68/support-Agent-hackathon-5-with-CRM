global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "techflow-api"
    static_configs:
      - targets: ["techflow-api:8000"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: "techflow-postgres"
    static_configs:
      - targets: ["postgres:5432"]
    metrics_path: /metrics
