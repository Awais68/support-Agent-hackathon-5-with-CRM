global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "techflow-api"
    static_configs:
      # Internal metrics port (METRICS_PORT), never the public API port (S11).
      - targets: ["techflow-api:9100"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: "techflow-postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metrics_path: /metrics
