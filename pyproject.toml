[project]
name = "specifyplus"
version = "0.1.0"
description = "Customer Success Digital FTE - AI-powered multi-channel support agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # OpenAI & Agent Framework
    "openai>=1.45.0",
    "openai-agents>=0.0.2",

    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # Database
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "sqlalchemy>=2.0.0",

    # Message Queue
    "aiokafka>=0.10.0",

    # External Services
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.105.0",
    "twilio>=9.0.0",

    # Utilities
    "vaderSentiment>=3.3.2",
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "aiofiles>=23.2.0",
    "httpx>=0.26.0",

    # Rate limiting & caching
    "slowapi>=0.1.9",
    "redis[hiredis]>=5.0.0",

    # Monitoring
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "locust>=2.17.0",
    # Checkers are pinned: a new release can add rules and turn CI red with no
    # code change. Bump them on purpose, together with the fixes they ask for.
    "black==26.10.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    # E2E browser testing
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    # Optional offline TTS fallback for the voice channel
    "gtts>=2.5.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "/(\\.kilo|web-form)/"

[tool.ruff]
extend-exclude = [".kilo", "web-form"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Line length is enforced by black; E501 would only flag long string
# literals (SQL, prompts) that black deliberately leaves intact.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
ignore_missing_imports = true
# Local-only trees (agent worktrees, venv, the Next.js app) are not part of
# the Python package and contain duplicate module names.
exclude = ['^\.kilo/', '^\.venv/', '^web-form/']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agent",
    "api",
    "channels",
    "chaos",
    "database",
    "workers",
]
only-include = [
    "main.py",
    "mcp_server.py",
    "embeddings_service.py",
    "kafka_client.py",
    "metrics.py",
    "exceptions.py",
    "context",
    "monitoring",
    "specs",
    "utils",
]
