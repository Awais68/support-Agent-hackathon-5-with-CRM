[project]
name = "specifyplus"
version = "0.1.0"
description = "Customer Success Digital FTE - AI-powered multi-channel support agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # OpenAI & Agent Framework
    "openai>=1.45.0",
    "openai-agents>=0.0.2",

    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # Database
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "sqlalchemy>=2.0.0",

    # Message Queue
    "aiokafka>=0.10.0",

    # External Services
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.105.0",
    "twilio>=9.0.0",

    # Utilities
    "vaderSentiment>=3.3.2",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "aiofiles>=23.2.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "locust>=2.17.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
